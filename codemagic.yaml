workflows:
  ios-release:
    name: Diek App - iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize platform files
        script: |
          flutter create . --platforms=ios,android --org com.sistemasdiek
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS Application (Unsigned Release)
        script: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd ..
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/ 2>/dev/null || cp -r build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/ 2>/dev/null || true
          cd build/ios/ipa
          zip -r DiekApp-unsigned.ipa Payload || true
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/Release-iphoneos/*.app
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Diek App - Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Initialize platform files
        script: |
          flutter create . --platforms=ios,android --org com.sistemasdiek
      - name: Fetch Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build Android App Bundle (.aab)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
