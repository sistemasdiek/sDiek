workflows:
  ios-release:
    name: Diek App - iOS Release Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        CI: "true"
    scripts:
      - name: Fetch Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS Application
        script: |
          flutter build ios --release --no-codesign --suppress-analytics
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/ 2>/dev/null || cp -r build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/ 2>/dev/null || true
          cd build/ios/ipa
          zip -r -q DiekApp-Full-Release.ipa Payload || true
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/Release-iphoneos/*.app
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Diek App - Android Release Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      vars:
        CI: "true"
    scripts:
      - name: Fetch Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --suppress-analytics
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
