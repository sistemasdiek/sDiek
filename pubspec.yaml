name: diek_app
description: "Diek App - Enterprise ERP & Field Operations Multiplatform Flutter Client (iOS, Android, Web, Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # State Management & Architecture
  provider: ^6.1.2
  
  # Supabase & Backend Services
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  
  # Utilities & Local Storage
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
